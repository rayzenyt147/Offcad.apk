<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFFCAD - Circuits</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;height:100vh;display:flex;flex-direction:column;background:#eef2f6;color:#1b2b3a;overflow:hidden}
#top{min-height:54px;background:#fff;border-bottom:1px solid #cfd8e0;display:flex;align-items:center;flex-wrap:wrap;padding:6px 12px;gap:6px;flex:none}
button{border:0;border-radius:6px;padding:8px 11px;font-size:13px;cursor:pointer;font-weight:600}
button.sec{background:#e9eef3;color:#1b2b3a}
button.sec:hover{background:#dbe4ec}
button:disabled{opacity:.4;cursor:default}
#codebtn{background:#1d5b8f;color:#fff}
#run{background:#2fb35a;color:#fff;font-size:14px;padding:9px 16px;margin-left:auto}
#run.on{background:#d9453d}
#activate{background:#f0b323;color:#17202a;font-weight:800}
#activate.on{background:#dc4a43;color:#fff}
#showparts{background:#dcecf8;color:#1d5b8f}
#side .hd{display:flex;align-items:center;gap:8px}
#side .hd span{flex:1}
#closeparts{padding:4px 8px;font-size:17px;line-height:1;background:#e4eaf0;color:#263746}
.lbl{font-size:12px;color:#667;margin-left:6px}
#colors{display:flex;gap:5px}
#colors span{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #aab}
#colors span.sel{box-shadow:0 0 0 2px #1d5b8f}
#main{flex:1;display:flex;min-height:0;position:relative}
#wrap{flex:1;position:relative;background:#fff;min-width:0}
canvas#cv{display:block;width:100%;height:100%;touch-action:none}
#side{width:230px;background:#f7f9fb;border-left:1px solid #cfd8e0;display:flex;flex-direction:column;flex:none}
#side .hd{padding:10px 12px 4px;font-weight:700;font-size:14px}
#side .hd small{font-weight:400;color:#889}
#q{margin:6px 12px;padding:7px 9px;border:1px solid #c5d0da;border-radius:6px;font-size:13px}
#grid{flex:1;overflow-y:auto;padding:6px 10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.item{background:#fff;border:1px solid #d6dee6;border-radius:8px;padding:5px 3px 4px;text-align:center;cursor:grab;font-size:11px;line-height:1.2}
.item:hover{border-color:#1d5b8f;background:#eef6fd}
.item canvas{display:block;margin:0 auto 3px}
#code{width:400px;background:#1e2430;color:#e6edf3;border-left:1px solid #0d1117;display:flex;flex-direction:column;flex:none}
#code[hidden]{display:none}
#code .ch{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#161b24;font-size:13px}
#code .ch b{flex:1}
#code select,#code input{background:#2a3242;color:#e6edf3;border:1px solid #3a455a;border-radius:5px;padding:5px;font-size:12px}
#code button{background:#33405a;color:#fff;padding:5px 9px;font-size:12px}
#src{flex:1;min-height:120px;resize:none;border:0;outline:0;background:#1e2430;color:#e6edf3;font:13px/1.45 Consolas,"Courier New",monospace;padding:10px;tab-size:2;white-space:pre}
#cerr{color:#ff7b72;font-size:12px;padding:0 10px 6px;white-space:pre-wrap;min-height:0}
#ser{height:130px;margin:0;overflow:auto;background:#0d1117;color:#7ee787;font:12px Consolas,monospace;padding:8px;white-space:pre-wrap}
#code .sin{display:flex;gap:6px;padding:6px 10px;background:#161b24}
#code .sin input{flex:1}
#status{height:28px;background:#fff;border-top:1px solid #cfd8e0;font-size:12.5px;padding:5px 12px;flex:none;display:flex;gap:16px}
#hint{color:#667;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg{font-weight:600}
#msg.bad{color:#b3261e}
@media (max-width:860px){
  #side{width:150px}
  #code{position:absolute;left:0;right:0;top:0;bottom:0;width:auto;z-index:5}
  #grid{grid-template-columns:1fr}
}
.logo{display:flex;flex-direction:column;line-height:1.05;margin-right:10px}.logo{font-size:19px;font-weight:800;color:#1d5b8f;letter-spacing:.5px}.logo small{display:block;font-size:10px;font-weight:500;color:#5d6f80;letter-spacing:.2px;margin-top:1px}

#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 38%,#236a9f,#0a2540 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"Segoe UI",Arial,sans-serif;transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .scene{width:64px;height:64px;perspective:420px;margin-bottom:30px}
#splash .cube{width:64px;height:64px;position:relative;transform-style:preserve-3d;animation:ocSpin 2.6s linear infinite}
#splash .cube i{position:absolute;width:64px;height:64px;border:2px solid #8fd8ff;background:rgba(143,216,255,.10);box-shadow:0 0 14px rgba(143,216,255,.35) inset}
#splash .cube i:nth-child(1){transform:translateZ(32px)}#splash .cube i:nth-child(2){transform:rotateY(180deg) translateZ(32px)}
#splash .cube i:nth-child(3){transform:rotateY(90deg) translateZ(32px)}#splash .cube i:nth-child(4){transform:rotateY(-90deg) translateZ(32px)}
#splash .cube i:nth-child(5){transform:rotateX(90deg) translateZ(32px)}#splash .cube i:nth-child(6){transform:rotateX(-90deg) translateZ(32px)}
@keyframes ocSpin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
#splash .name{font-size:52px;font-weight:800;letter-spacing:4px;background:linear-gradient(90deg,#fff 0%,#8fd8ff 40%,#fff 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ocShine 2s linear infinite,ocRise .8s ease-out both}
@keyframes ocShine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes ocRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#splash .bar{width:190px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:20px;overflow:hidden}
#splash .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fd8ff,#fff);border-radius:2px;animation:ocLoad 1.9s ease-in-out forwards}
@keyframes ocLoad{0%{width:0}60%{width:70%}100%{width:100%}}
#splash button{margin-top:22px;min-width:150px;padding:11px 30px;border:2px solid rgba(255,255,255,.55);border-radius:30px;background:rgba(255,255,255,.08);color:#fff;font:700 16px "Segoe UI",Arial,sans-serif;letter-spacing:2px;cursor:default;transition:all .25s}
#splash button.ready{background:#fff;color:#0f3a5e;border-color:#fff;cursor:pointer;animation:ocPulse 1.6s ease-in-out infinite}
#splash button.ready:hover{transform:scale(1.07)}
@keyframes ocPulse{0%,100%{box-shadow:0 0 0 0 rgba(143,216,255,.55)}50%{box-shadow:0 0 0 12px rgba(143,216,255,0)}}
#creator-credit{position:fixed;right:10px;bottom:7px;z-index:9999;font:12px "Segoe UI",Arial,sans-serif;color:#526273;background:rgba(255,255,255,.92);border:1px solid #d5dee7;border-radius:6px;padding:5px 8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#creator-credit a{color:#1d5b8f;font-weight:700;text-decoration:none}
#creator-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="creator-credit">Made by <a href="https://rayzenyt147.itch.io" target="_blank" rel="noopener noreferrer">Rayzen_YT147</a></div>
<div id="splash"><div class="scene"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="name">OFFCAD</div><div class="bar"><b></b></div><button id="startBtn" disabled>Loading&hellip;</button></div>
<script>(function(){var s=document.getElementById('splash'),b=document.getElementById('startBtn'),t0=Date.now(),ready=false,gone=false;
function enable(){if(ready)return;ready=true;b.disabled=false;b.textContent='Start';b.className='ready';try{b.focus()}catch(e){}}
function go(){if(!ready||gone)return;gone=true;s.classList.add('hide');setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},800)}
b.addEventListener('click',go);document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')go()});
window.addEventListener('load',function(){setTimeout(enable,Math.max(200,1900-(Date.now()-t0)))});setTimeout(enable,4500)})();</script>
<div id="top">
  <div class="logo">OFFCAD</div>
  <button class="sec" id="showparts" title="Show component drawer" hidden>☷ Components</button><button class="sec" id="zoomout" title="Zoom out">− Zoom</button><button class="sec" id="zoomin" title="Zoom in">+ Zoom</button><button class="sec" id="rot" title="Rotate selected part (R)">&#10227; Rotate</button>
  <button class="sec" id="dup" title="Copy (Ctrl+D)">&#10064; Copy</button>
  <button class="sec" id="del" title="Delete selected (Del)">&#128465; Delete</button><button id="activate" title="Press/release the selected tactile switch or pushbutton" disabled>☝ Activate</button>
  <button class="sec" id="undo">&#8630; Undo</button>
  <button class="sec" id="save">Save</button>
  <button class="sec" id="open">Open</button>
  <input type="file" id="file" accept=".json" hidden>
  <button class="sec" id="clr">Clear</button>
  <span class="lbl">Wire</span><div id="colors"></div>
  <button id="codebtn">&lt;/&gt; Code</button>
  <button id="run">&#9654; Start Simulation</button>
</div>
<div id="main">
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="code" hidden>
    <div class="ch"><b>Code (Arduino C++)</b>
      <select id="ex"><option value="">Load example&hellip;</option></select>
      <button id="cclose">&#10005;</button></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div id="cerr"></div>
    <div class="ch"><b>Serial Monitor</b><button id="sclr">Clear</button></div>
    <pre id="ser"></pre>
    <div class="sin"><input id="sin" placeholder="Send text to Arduino"><button id="ssend">Send</button></div>
  </div>
  <div id="side">
    <div class="hd"><span>Components <small>Basic</small></span><button class="sec" id="closeparts" title="Close component drawer" aria-label="Close component drawer">×</button></div>
    <input id="q" placeholder="Search components">
    <div id="grid"></div>
  </div>
</div>
<div id="status"><span id="hint">Drag parts in &bull; drag from pin to pin to wire (do it again to remove the wire) &bull; double-click a part to edit &bull; Rotate button or R &bull; wheel zoom &bull; drag empty space to pan</span><span id="msg"></span></div>

<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const DPR=window.devicePixelRatio||1;
let parts=[],wires=[],nextId=1,sel=null,running=false,sim=null,raf=0,lastT=0;
let wireFrom=null,pendingClick=false,drag=null,pan=null,mouse={x:0,y:0},wireColor='#2fb34a',lastTap={p:null,t:0};
let view={k:1,ox:20,oy:10},undoStack=[],sketch='',progErr='',rt=null,gen=null;
const COS=[1,0,-1,0],SIN=[0,1,0,-1];
const LEDC={red:{c:'#ff2a2a',vf:1.9},green:{c:'#25d84a',vf:2.1},yellow:{c:'#ffd22a',vf:2.0},blue:{c:'#3a7bff',vf:3.0},white:{c:'#f4f4ff',vf:3.0}};
const BAND=['#000','#7a3b10','#e22','#f80','#fd0','#2a2','#25f','#a3f','#888','#fff'];
const BAT={battery9:{v:9,r:1.5},coin:{v:3,r:10},aa:{v:1.5,r:0.2}};
const WCOLORS=['#2fb34a','#e03a3a','#222','#2f6fe0','#f0c020','#f0801c','#9b4fd0','#888'];

/* ---------- small helpers ---------- */
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}
function fmtI(i){const a=Math.abs(i);return a<1e-3?(i*1e6).toFixed(0)+' \u00B5A':a<1?(i*1e3).toFixed(1)+' mA':i.toFixed(2)+' A'}
function fmtSI(v,u){const a=Math.abs(v),t=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'\u00B5'],[1e-9,'n'],[1e-12,'p']];
  for(const[s,p]of t)if(a>=s*0.9999)return +(v/s).toPrecision(3)+' '+p+u;return v+' '+u}
function parseVal(s){
  s=String(s).trim().replace(/[\u03A9\u2126]|ohms?|farads?|f$/gi,'').trim();
  const m=s.match(/^([0-9.]+)\s*([pnu\u00B5mkMG]?)/);if(!m)return NaN;
  const mult={p:1e-12,n:1e-9,u:1e-6,'\u00B5':1e-6,m:1e-3,k:1e3,M:1e6,G:1e9,'':1};
  return parseFloat(m[1])*mult[m[2]];
}
function pinW(p,i){const q=PD[p.type].pins[i],c=COS[p.rot],s=SIN[p.rot];return{x:p.x+q.x*c-q.y*s,y:p.y+q.x*s+q.y*c}}
function toLocal(p,m){const dx=m.x-p.x,dy=m.y-p.y,c=COS[p.rot],s=SIN[p.rot];return{x:dx*c+dy*s,y:-dx*s+dy*c}}
function inBox(p,m,pad){const l=toLocal(p,m),b=PD[p.type].bbox;return l.x>=b[0]-pad&&l.x<=b[2]+pad&&l.y>=b[1]-pad&&l.y<=b[3]+pad}
function ord(){return parts.filter(p=>p.type==='breadboard').concat(parts.filter(p=>p.type!=='breadboard'))}

/* ---------- breadboard pins ---------- */
const bbPins=[],bbGroups={};
function bbIdx(c,r){const k={3:0,4:1,5:2,6:3,7:4,9:5,10:6,11:7,12:8,13:9,0:10,1:11,15:12,16:13}[r];return (c-1)*14+k}
(function(){
  for(let c=1;c<=30;c++){
    const x=(c-15)*12;
    const add=(r,g)=>{bbPins.push({x,y:(r-8)*12,n:'hole'});(bbGroups[g]=bbGroups[g]||[]).push(bbPins.length-1)};
    [3,4,5,6,7].forEach(r=>add(r,'A'+c));
    [9,10,11,12,13].forEach(r=>add(r,'B'+c));
    [0,1,15,16].forEach(r=>add(r,'R'+r));
  }
})();

/* ---------- Arduino Uno pins ---------- */
const UNO=[],UNO_D={},UNO_GND=[];let UNO_5V=0,UNO_33=0;
(function(){
  const add=(x,y,n,d)=>{UNO.push({x,y,n});const i=UNO.length-1;if(d!==undefined)UNO_D[d]=i;return i};
  [['AREF'],['GND'],['13',13],['12',12],['11',11],['10',10],['9',9],['8',8]].forEach((q,k)=>{const i=add(k*12,0,q[0],q[1]);if(q[0]==='GND')UNO_GND.push(i)});
  [7,6,5,4,3,2,1,0].forEach((d,k)=>add(108+k*12,0,String(d),d));
  [['IOREF'],['RESET'],['3.3V'],['5V'],['GND'],['GND'],['VIN']].forEach((q,k)=>{const i=add(24+k*12,216,q[0]);
    if(q[0]==='GND')UNO_GND.push(i);if(q[0]==='5V')UNO_5V=i;if(q[0]==='3.3V')UNO_33=i});
  for(let a=0;a<6;a++)add(120+a*12,216,'A'+a,14+a);
})();

/* ---------- part definitions ---------- */
const PD={};

PD.breadboard={name:'Breadboard Small',pins:bbPins,bbox:[-190,-114,202,114],
 draw(c){
  c.fillStyle='#e9e9e7';rr(c,-190,-114,392,228,8);c.fill();c.strokeStyle='#b9b9b5';c.lineWidth=1.5;c.stroke();
  c.fillStyle='#d6d6d2';c.fillRect(-190,-8,392,16);
  c.fillStyle='#4a90e2';c.fillRect(-172,-105,348,1.6);c.fillRect(-172,74.5,348,1.6);
  c.fillStyle='#e04545';c.fillRect(-172,-75.5,348,1.6);c.fillRect(-172,104.5,348,1.6);
  c.fillStyle='#55585c';c.beginPath();
  for(const q of bbPins)c.rect(q.x-2.2,q.y-2.2,4.4,4.4);
  c.fill();
  c.fillStyle='#808080';c.font='7px Arial';c.textAlign='center';
  for(let n=1;n<=30;n++)if(n===1||n%5===0){const x=(n-15)*12;c.fillText(n,x,-70);c.fillText(n,x,78)}
  'jihgf'.split('').forEach((l,i)=>{c.fillText(l,-182,(3+i-8)*12+2.5);c.fillText(l,194,(3+i-8)*12+2.5)});
  'edcba'.split('').forEach((l,i)=>{c.fillText(l,-182,(9+i-8)*12+2.5);c.fillText(l,194,(9+i-8)*12+2.5)});
  c.font='bold 9px Arial';
  [[0,'\u2212'],[1,'+'],[15,'\u2212'],[16,'+']].forEach(([r,t])=>{c.fillText(t,-182,(r-8)*12+3);c.fillText(t,194,(r-8)*12+3)});
 }};

PD.uno={name:'Arduino Uno R3',pins:UNO,bbox:[-114,-14,226,230],groups:[UNO_GND],dpin:UNO_D,gnd:UNO_GND,v5:UNO_5V,v33:UNO_33,
 label:()=>'Arduino Uno R3',
 draw(c,p,r){
  c.fillStyle='#0a7c8c';rr(c,-104,-12,328,240,10);c.fill();c.strokeStyle='#065a66';c.lineWidth=2;c.stroke();
  c.fillStyle='#c9ccd0';c.fillRect(-114,30,64,66);c.strokeStyle='#8e9196';c.lineWidth=1.5;c.strokeRect(-114,30,64,66);
  c.fillStyle='#1e1e1e';c.fillRect(-114,138,54,54);
  c.fillStyle='#1b1b1b';[[-6,96],[102,96],[18,84],[114,72]].forEach(([x,w,],k)=>{});
  c.fillRect(-6,-8,96,14);c.fillRect(102,-8,96,14);c.fillRect(18,209,84,14);c.fillRect(114,209,72,14);
  c.fillStyle='#b8b8b8';UNO.forEach(q=>c.fillRect(q.x-2.4,q.y-2.4,4.8,4.8));
  c.fillStyle='#ccc';c.font='bold 7.5px Arial';c.textAlign='left';
  UNO.forEach(q=>{c.save();if(q.y<100){c.translate(q.x+3,19);c.rotate(Math.PI/2)}else{c.translate(q.x+3,198);c.rotate(-Math.PI/2)}
    c.fillText(q.n,0,0);c.restore()});
  c.fillStyle='#b92d2d';circ(c,-82,12,7);c.fill();c.strokeStyle='#700';c.lineWidth=1;c.stroke();
  c.fillStyle='#202020';rr(c,40,110,128,36,2);c.fill();
  c.fillStyle='#777';for(let k=0;k<14;k++){c.fillRect(46+k*8.6,106,4,4);c.fillRect(46+k*8.6,146,4,4)}
  c.fillStyle='#e9e9e9';c.font='bold 18px Arial';c.textAlign='center';c.fillText('ARDUINO',104,66);c.font='bold 13px Arial';c.fillText('UNO',104,82);
  c.font='7px Arial';c.fillStyle='#bfe8ee';c.fillText('ATMEGA328P',104,132);
  const on=!!r,l13=r&&r.pv[UNO_D[13]]>2.5;
  c.fillStyle=on?'#4cff6a':'#1d4a24';c.shadowColor=on?'#4cff6a':'transparent';c.shadowBlur=on?8:0;c.fillRect(170,34,8,5);
  c.fillStyle=l13?'#ffb020':'#4a3a14';c.shadowColor=l13?'#ffb020':'transparent';c.shadowBlur=l13?8:0;c.fillRect(150,34,8,5);c.shadowBlur=0;
  c.fillStyle='#ccc';c.font='6px Arial';c.fillText('L',154,48);c.fillText('ON',174,48);
 }};

PD.resistor={name:'Resistor',pins:[{x:-24,y:0,n:'Pin 1'},{x:24,y:0,n:'Pin 2'}],bbox:[-26,-8,26,8],
 label:p=>fmtSI(p.val,'\u03A9'),
 draw(c,p){
  c.strokeStyle='#9a9a9a';c.lineWidth=2.6;line(c,-24,0,-13,0);line(c,13,0,24,0);
  c.fillStyle='#e6cf9a';rr(c,-15,-5.5,30,11,5);c.fill();c.strokeStyle='#b39a62';c.lineWidth=.8;c.stroke();
  let v=Math.max(p.val,.1),e=Math.floor(Math.log10(v))-1,d=Math.round(v/Math.pow(10,e));
  if(d>=100){d=Math.round(d/10);e++}
  const m=Math.max(-1,Math.min(9,e));
  const cols=[BAND[Math.floor(d/10)%10],BAND[d%10],m<0?'#d4af37':BAND[m],'#d4af37'];
  [-9,-4,1,10].forEach((x,i)=>{c.fillStyle=cols[i];c.fillRect(x,-5.5,2.6,11)});
 }};

function domePath(c,x0,w,top){
  const r=w/2;c.beginPath();c.moveTo(x0,-14);c.lineTo(x0,top);c.arc(x0+r,top,r,Math.PI,0);c.lineTo(x0+w,-14);c.closePath();
}
PD.led={name:'LED',pins:[{x:0,y:0,n:'Anode (+)'},{x:12,y:0,n:'Cathode (\u2212)'}],bbox:[-8,-42,20,4],
 label:(p,r)=>p.color+' LED'+(r?'  '+fmtI(r.i):''),
 draw(c,p,r){
  const col=LEDC[p.color].c,lit=r&&r.i>0.0008&&!p.burnt,b=lit?Math.min(1,r.i/0.02):0;
  c.strokeStyle='#aaa';c.lineWidth=2;line(c,0,0,0,-14);line(c,12,0,12,-14);
  c.save();

function fmtV(v,u){const a=Math.abs(v);return a<1?(v*1000).toFixed(1)+' m'+u:v.toFixed(2)+' '+u}
function fmtT(t){return t>=1?+t.toPrecision(3)+' s':t>=1e-3?+(t*1e3).toPrecision(3)+' ms':+(t*1e6).toPrecision(3)+' \u00B5s'}
function fmtHz(f){return f>=1e6?+(f/1e6).toPrecision(3)+' MHz':f>=1e3?+(f/1e3).toPrecision(3)+' kHz':+f.toPrecision(3)+' Hz'}
function knobDraw(c,x,y,frac,col){
  c.fillStyle='#d9d9d9';circ(c,x,y,15);c.fill();c.strokeStyle='#9a9a9a';c.lineWidth=1.2;c.stroke();
  c.fillStyle='#f4f4f4';circ(c,x,y,11);c.fill();
  const a=(135+270*Math.max(0,Math.min(1,frac)))*Math.PI/180;
  c.strokeStyle=col||'#333';c.lineWidth=2.4;line(c,x,y,x+10*Math.cos(a),y+10*Math.sin(a));
  c.fillStyle='#555';circ(c,x,y,2);c.fill();
}
function toggleDraw(c,x,y,on){
  c.fillStyle='#d4d4d4';rr(c,x,y,32,16,8);c.fill();c.strokeStyle='#aaa';c.lineWidth=1;c.stroke();
  c.fillStyle=on?'#2fb35a':'#555';circ(c,on?x+24:x+8,y+8,7);c.fill();
  c.fillStyle='#888';c.font='bold 6px Arial';c.textAlign='center';c.fillText(on?'ON':'OFF',on?x+11:x+23,y+10);
}
function jack(c,x,y,col){c.fillStyle=col;circ(c,x,y,5.5);c.fill();c.strokeStyle='rgba(0,0,0,.45)';c.lineWidth=1.2;c.stroke();c.fillStyle='rgba(0,0,0,.35)';circ(c,x,y,2);c.fill()}

const MM_MODES=[['A',-79],['V',-63],['R',-47]];
function mmText(p,r){
  if(!r)return'';
  if(p.mode==='V'){let v=r.v;if(r.vr!==undefined){const s=Math.abs(r.vm)>0.7*r.vr?Math.sign(r.vm)||1:1;v=s*r.vr}return fmtV(v,'V')}
  if(p.mode==='A'){let i=r.i;if(r.ir!==undefined){const s=Math.abs(r.im)>0.7*r.ir?Math.sign(r.im)||1:1;i=s*r.ir}return fmtV(i,'A')}
  const R=r.rohm;return(R===undefined||!isFinite(R)||R>1e7)?'OL':fmtSI(Math.max(0,R),'\u03A9');
}

const TYPES_I=new Set(['int','long','short','byte','char','bool','boolean','word','size_t','uint8_t','uint16_t','uint32_t','uint64_t','int8_t','int16_t','int32_t','int64_t']);

  isDigit:'i',isAlpha:'i',F:'s',interrupts:'v',noInterrupts:'v'};
const BIN_PREC={'||':1,'&&':2,'|':3,'^':4,'&':5,'==':6,'!=':6,'<':7,'<=':7,'>':7,'>=':7,'<<':8,'>>':8,'+':9,'-':9,'*':10,'/':10,'%':10};

const LOOP_GUARD='if(++rt.ops>rt.LIM){rt.ops=0;yield 0;}';

function lexSketch(src){
  const toks=[],macros={};let i=0,line=1;const n=src.length;
  const OPS=['<<=','>>=','++','--','+=','-=','*=','/=','%=','&=','|=','^=','<<','>>','<=','>=','==','!=','&&','||','->','::'];
  while(i<n){
    const ch=src[i];

    if(/\s/.test(ch)){i++;continue}
    if(ch==='/'&&src[i+1]==='/'){while(i<n&&src[i]!=='\n')i++;continue}
    if(ch==='/'&&src[i+1]==='*'){const e=src.indexOf('*/',i+2),seg=src.slice(i,e<0?n:e+2);line+=(seg.match(/\n/g)||[]).length;i=e<0?n:e+2;continue}
    if(ch==='#'){let e=i;while(e<n&&src[e]!=='\n')e++;const dl=src.slice(i,e);i=e;

    if(/[0-9]/.test(ch)||(ch==='.'&&/[0-9]/.test(src[i+1]||''))){
      const m=src.slice(i).match(/^(0[xX][0-9a-fA-F]+|0[bB][01]+|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)([uUlLfF]*)/);
      const txt=m[1],suf=m[2];let val,isF=false;
      if(/^0[xX]/.test(txt))val=parseInt(txt,16);else if(/^0[bB]/.test(txt))val=parseInt(txt.slice(2),2);
      else{val=parseFloat(txt);isF=/[.eE]/.test(txt)||/[fF]/.test(suf)}
      toks.push({k:'num',v:val,f:isF,line});i+=m[0].length;continue}
    if(ch==='"'){let e=i+1,s='';while(e<n&&src[e]!=='"'){if(src[e]==='\\'){const c=src[e+1];s+=c==='n'?'\n':c==='t'?'\t':c==='r'?'\r':c==='0'?'\0':c;e+=2}else s+=src[e++]}
      toks.push({k:'str',v:s,line});i=e+1;continue}
    if(ch==="'"){let e=i+1,v;if(src[e]==='\\'){const c=src[e+1];v=c==='n'?10:c==='t'?9:c==='r'?13:c==='0'?0:c.charCodeAt(0);e+=2}else{v=src.charCodeAt(e);e++}
      toks.push({k:'num',v,f:false,line});i=e+1;continue}
    let op=OPS.find(o=>src.startsWith(o,i));if(!op)op=ch;
    toks.push({k:'op',v:op,line});i+=op.length;
  }
  return{toks,macros};
}

function compileSketch(src){
  const L=lexSketch(src);
  let T=[];
  const expand=(arr,depth)=>{for(const t of arr){
    if(t.k==='id'&&L.macros[t.v]!==undefined&&depth<4){expand(lexSketch(L.macros[t.v]).toks.map(x=>Object.assign({},x,{line:t.line})),depth+1)}
    else T.push(t)}};
  expand(L.toks,0);
  let p=0;
  const scopes=[new Map()],funcs=new Map();
  const err=(m,t)=>{const tk=t||T[p]||T[T.length-1]||{};throw new Error('line '+(tk.line||'?')+': '+m)};
  const peek=(o)=>T[p+(o||0)];
  const isOp=(v,o)=>{const t=T[p+(o||0)];return !!t&&t.k==='op'&&t.v===v};
  const isId=(v,o)=>{const t=T[p+(o||0)];return !!t&&t.k==='id'&&t.v===v};
  const next=()=>{if(p>=T.length)err('unexpected end of file');return T[p++]};
  const expectOp=v=>{if(!isOp(v))err("expected '"+v+"'"+(peek()?" before '"+peek().v+"'":''));return next()};
  const declare=(name,info)=>scopes[scopes.length-1].set(name,info);
  const lookup=name=>{for(let i=scopes.length-1;i>=0;i--)if(scopes[i].has(name))return scopes[i].get(name);return null};

  function parseType(){

      if(TYPES_I.has(v)){next();seen=true;t=(t==='f')?'f':'i';base=v;continue}
      if(TYPES_F.has(v)){next();seen=true;t='f';base=v;continue}
      if(v==='void'){next();seen=true;t='v';base='void';break}
      if(v==='String'){next();seen=true;t='s';base='String';break}

  const conv=(r,tt)=>(tt==='i'&&r.t==='f')?'Math.trunc('+r.c+')':r.c;
  function expr(){return assign()}
  function assign(){

  }

      case '||':return{c:'(('+l.c+')||('+r.c+')?1:0)',t:'i'};
      case '==':return{c:'(('+l.c+')===('+r.c+')?1:0)',t:'i'};
      case '!=':return{c:'(('+l.c+')!==('+r.c+')?1:0)',t:'i'};
      case '<':case '<=':case '>':case '>=':return{c:'(('+l.c+')'+op+'('+r.c+')?1:0)',t:'i'};
      case '+':return{c:'('+l.c+'+'+r.c+')',t:(l.t==='s'||r.t==='s')?'s':fl?'f':'i'};
      case '-':case '*':return{c:'('+l.c+op+r.c+')',t:fl?'f':'i'};

  function castTo(ty,e){
    if(ty.t==='f')return{c:e.c,t:'f'};

        case 'indexOf':return{c:e.c+'.indexOf('+A+')',t:'i'};

        case 'startsWith':return{c:'('+e.c+'.startsWith('+A+')?1:0)',t:'i'};

      if(TYPES_I.has(name)||TYPES_F.has(name)){const a=args();const f=TYPES_F.has(name);return f?{c:a[0].c,t:'f'}:castTo({t:'i',base:name},a[0])}

    const prog=compileSketch(sketch)(rt);

  }catch(e){progErr='Compile error: '+e.message;document.getElementById('cerr').textContent=progErr;gen=null}

function tickProgram(dtMs){
  if(!rt)return;
  rt.T+=dtMs;
  for(const P of rt.pins)if(P.tone>0&&P.toneEnd>0&&rt.T>=P.toneEnd){P.tone=0;P.toneEnd=0}
  if(!gen)return;
  let budget=400;
  try{
    while(budget-->0&&rt.clock<=rt.T){
      const r=gen.next();
      if(r.done){gen=null;break}
      if(r.value>0)rt.clock+=r.value;else rt.clock+=0.3;
    }

    if(Math.abs(A[piv][c])<1e-30)return null;
    const t=A[c];A[c]=A[piv];A[piv]=t;

  for(let r=n-1;r>=0;r--){let s=A[r][n];for(let k=r+1;k<n;k++)s-=A[r][k]*x[k];x[r]=s/A[r][r]}

        case 'buzzer':stamp(n[0],n[1],1/2000);break;
        case 'servo':stamp(n[1],n[0],1/100);stamp(n[2],n[0],1e-5);break;
        case 'vib':stamp(n[0],n[1],1/40);break;
        case 'dc':stamp(n[0],n[1],1/12);break;
        case 'lcd':stamp(n[1],n[0],1/1000);break;
        case 'bulb':stamp(n[0],n[1],1/60);break;
        case 'oled':stamp(n[1],n[0],1/250);break;
        case 'mm':if(p.mode==='V')stamp(n[0],n[1],1e-7);else if(p.mode==='A')stamp(n[0],n[1],1000);break;
        case 'scope':stamp(n[0],n[1],1e-6);break;

        case 'usb':{const g=2,v=zero?0:5;stamp(n[0],n[3],g);inj(n[0],v*g);inj(n[3],-v*g);break}
        case 'uno':{

          if(rt)for(let d=0;d<20;d++){const P=rt.pins[d],a=n[UNO_D[d]];

    }
    if(opt.inj)for(const q of opt.inj)inj(q[0],q[1]);
    for(const e of dl){
      const n=ND.get(e.p),a=n[e.d.a],c=n[e.d.c],g=1/e.d.rs;
      if(e.p._on[e.k]&&!(e.d.burn&&e.p.burnt)){stamp(a,c,g);inj(a,g*e.d.vf);inj(c,-g*e.d.vf)}else stamp(a,c,1e-9);

      const n=ND.get(e.p),va=n[e.d.a]>=0?V[n[e.d.a]]:0,vc=n[e.d.c]>=0?V[n[e.d.c]]:0,on=e.p._on[e.k];

    }
    if(!zero)for(const p of parts){

  }

    const dd=DIO[p.type];
    if(dd){dd(p).forEach((d,k)=>{const on=p._on[k]&&!(d.burn&&p.burnt);r.d.push(on?Math.max(0,(pv[d.a]-pv[d.c]-d.vf)/d.rs):0)});r.i=r.d[0]}

      case 'cap':case 'ecap':{const nv=pv[0]-pv[1];r.i=p.val*(nv-p.vc)/Math.max(dt,1e-6);r.vc=nv;
        if(commit&&!opt.ro){p.vc=nv;if(p.type==='ecap'&&!p.burst&&(nv<-1.5||nv>p.rating))p.burst=true}break}
      case 'battery9':case 'coin':case 'aa':{const B=BAT[p.type];r.i=(B.v-(pv[0]-pv[1]))/B.r;
        if(r.i>3){msg='Short circuit! The battery is overloaded.';bad=true}break}
      case 'buzzer':r.i=(pv[0]-pv[1])/2000;break;
      case 'servo':r.i=(pv[1]-pv[0])/100;break;
      case 'vib':r.i=(pv[0]-pv[1])/40;break;
      case 'dc':r.i=(pv[1]-pv[0])/12;break;
      case 'bulb':r.i=(pv[0]-pv[1])/60;break;
      case 'mm':r.v=pv[1]-pv[0];r.i=p.mode==='A'?(pv[1]-pv[0])*1000:0;break;
      case 'psu':{const v=pv[0]-pv[1];r.v=v;r.i=p.on?(p._cc?p.ilim:Math.max(0,(p.volt-v)*20)):0;r.cc=!!p._cc;

    }

function avgSolves(list){
  const last=list[list.length-1],K=list.length;
  if(!last.res.size)return last;
  last.res.forEach((r,p)=>{
    const pv=r.pv.map(()=>0),d=r.d.map(()=>0);let i=0,v=0,vq=0,iq=0;
    list.forEach(s=>{const q=s.res.get(p);if(!q)return;
      q.pv.forEach((x,j)=>pv[j]+=x/K);q.d.forEach((x,j)=>d[j]+=x/K);i+=q.i/K;
      if(q.v!==undefined){v+=q.v/K;vq+=q.v*q.v/K;iq+=q.i*q.i/K}});
    if(r.v!==undefined){r.vm=v;r.vr=Math.sqrt(vq);r.ir=Math.sqrt(iq);r.im=i;r.v=v}
    r.pv=pv;r.d=d;r.i=i;
  });

}
let simTime=0;
function solveFrame(dt){
  simTime+=dt;
  const nb=buildNet();
  if(nb.empty)return{res:new Map(),net:nb.net,msg:nb.msg,bad:false};
  const gens=parts.filter(p=>p.type==='fgen'&&p.on);
  const fast=gens.find(g=>g.freq>=30);
  let pwm=false;
  if(rt&&nb.U)for(let d=0;d<20;d++){const P=rt.pins[d];
    if(P.mode===1&&((P.pwm>0&&P.pwm<1)||P.tone>0||P.servo>=0)){pwm=true;break}}
  let W=0,K=1;
  if(fast){W=1/fast.freq;K=32}else if(pwm){W=1/490;K=12}
  let out;
  if(!W)out=solveNum(nb,dt,true,simTime,{});
  else{const list=[];for(let k=0;k<K;k++)list.push(solveNum(nb,dt/K,true,simTime+(k+.5)/K*W,{}));out=avgSolves(list)}
  // resistance mode of multimeters: test current with every source switched off
  for(const m of parts){
    if(m.type!=='mm'||m.mode!=='R')continue;
    const n=nb.ND.get(m),q=out.res.get(m);if(!q)continue;
    const r=solveNum(nb,1,false,0,{ro:true,zero:true,capOpen:true,inj:[[n[1],1e-3],[n[0],-1e-3]]});
    const rr=r.res.get(m);
    q.rohm=rr?(rr.pv[1]-rr.pv[0])/1e-3:Infinity;
  }
  // oscilloscopes
  for(const sc of parts){
    if(sc.type!=='scope')continue;
    sc._=sc._||{};
    const S=nb.N>60?48:96,Tw=sc.tdiv*10,q=out.res.get(sc);
    if(!q)continue;
    if(Tw>=0.25){ // slow: scrolling history
      const h=sc._.hist=sc._.hist||[];
      h.push([simTime,q.pv[1]-q.pv[0]]);
      while(h.length>2&&h[1][0]<simTime-Tw)h.shift();
      const tr=new Float32Array(S);let j=0;
      for(let k=0;k<S;k++){const tk=simTime-Tw+k/(S-1)*Tw;while(j<h.length-1&&h[j+1][0]<=tk)j++;tr[k]=tk<h[0][0]?NaN:h[j][1]}
      sc._.trace=tr;
    }else{
      const t0=(fast||pwm)?0:simTime,tr=new Float32Array(S);
      for(let k=0;k<S;k++){const r=solveNum(nb,Tw/S,false,t0+k/(S-1)*Tw,{ro:true}),qq=r.res.get(sc);tr[k]=qq?qq.pv[1]-qq.pv[0]:0}
      sc._.trace=tr;sc._.hist=null;
    }
  }
  return out;
}

/* ---------- animation / audio ---------- */
let actx=null,osc=null,gain=null;
function setBuzz(v,f){
  if(!actx)return;
  gain.gain.setTargetAtTime(v*0.05,actx.currentTime,0.02);
  if(f)osc.frequency.setTargetAtTime(f,actx.currentTime,0.01);
}
function animate(dt){
  let buzz=0,freq=2000;
  const U=parts.find(p=>p.type==='uno'),net=sim.net;
  const ur=U&&sim.res.get(U);
  if(rt&&ur)for(let d=0;d<20;d++)rt.volt[d]=ur.pv[UNO_D[d]];
  for(const p of parts){
    const r=sim.res.get(p);if(!r)continue;
    p._=p._||{};const a=p._;
    if(p.type==='dc'){const v=r.pv[1]-r.pv[0];a.ang=(a.ang||0)+Math.max(-1,Math.min(1,v/6))*Math.PI*2*6*dt}
    else if(p.type==='vib')a.on=Math.abs(r.pv[0]-r.pv[1])>1.0;
    else if(p.type==='servo'){
      const powered=r.pv[1]-r.pv[0]>=4;let bound=false;
      if(U&&rt&&net){const sr=net(p,2);for(let d=0;d<20;d++){const P=rt.pins[d];if(P.servo>=0&&net(U,UNO_D[d])===sr){a.tgt=P.servo;bound=true}}}
      if(powered&&!bound)a.tgt=Math.max(0,Math.min(5,r.pv[2]-r.pv[0]))/5*180;
      if(powered){const cur=a.ang===undefined?90:a.ang,tg=a.tgt===undefined?cur:a.tgt,d=tg-cur;a.ang=cur+Math.sign(d)*Math.min(Math.abs(d),420*dt)}
    }
    else if(p.type==='buzzer'){
      const v=Math.abs(r.pv[0]-r.pv[1]);a.on=v>1.5;a.freq=2000;
      if(U&&rt&&net){const n0=net(p,0),n1=net(p,1);for(let d=0;d<20;d++){const P=rt.pins[d];if(P.tone>0){const nd=net(U,UNO_D[d]);if(nd===n0||nd===n1)a.freq=P.tone}}}
      if(a.on){buzz=Math.max(buzz,Math.min(1,v/3));freq=a.freq}
    }
    else if(p.type==='lcd'){
      a.obj=null;
      if(U&&rt&&net)for(const o of rt.lcds){
        const map=[3,5,10,11,12,13];
        if(map.every((pi,k)=>UNO_D[o.pins[k]]!==undefined&&net(p,pi)===net(U,UNO_D[o.pins[k]])))a.obj=o;
      }
    }
    else if(p.type==='oled'){
      a.obj=null;
      if(U&&rt&&net)for(const o of rt.oleds)if(net(p,3)===net(U,UNO_D[18])&&net(p,2)===net(U,UNO_D[19]))a.obj=o;
    }
  }
  setBuzz(buzz,freq);
}
function frame(dtSec){
  tickProgram(dtSec*1000);
  sim=solveFrame(dtSec);
  if(sim.res.size)animate(dtSec);
  setMsg();updateSerial();
}
function loop(t){
  if(!running)return;
  const dt=Math.min(0.05,Math.max(0.001,(t-lastT)/1000||0.016));lastT=t;
  frame(dt);draw();
  raf=requestAnimationFrame(loop);
}
function setMsg(){
  const m=document.getElementById('msg');
  if(!running){m.textContent='';m.className='';return}
  if(progErr){m.textContent=progErr;m.className='bad';return}
  m.textContent=sim&&sim.msg?sim.msg:'Simulating\u2026';m.className=sim&&sim.bad?'bad':'';
}
function updateSerial(){
  if(rt&&rt.serDirty){const el=document.getElementById('ser');el.textContent=rt.ser;el.scrollTop=el.scrollHeight;rt.serDirty=false}
}
function setActivatedPart(on){
  if(!sel||sel.kind!=='part'||!['push','tactile'].includes(sel.o.type))return;
  if(sel.o.pressed===on)return;
  snap();sel.o.pressed=on;draw();
}
function toggleActivatedPart(){
  if(!sel||sel.kind!=='part'||sel.o.type!=='tactile')return;
  setActivatedPart(!sel.o.pressed);
}
function pressPushbutton(){
  if(!sel||sel.kind!=='part'||sel.o.type!=='push')return;
  setActivatedPart(true);
}
function releasePushbutton(){
  if(sel&&sel.kind==='part'&&sel.o.type==='push')setActivatedPart(false);
}
function setRunning(on){
  running=on;
  const b=document.getElementById('run');
  b.classList.toggle('on',running);
  b.innerHTML=running?'&#9632; Stop Simulation':'&#9654; Start Simulation';
  if(running){
    sketch=document.getElementById('src').value;
    document.getElementById('ser').textContent='';
    startProgram();
    try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();osc=actx.createOscillator();gain=actx.createGain();
      osc.type='square';osc.frequency.value=2000;gain.gain.value=0;osc.connect(gain);gain.connect(actx.destination);osc.start()}
      if(actx.state==='suspended')actx.resume()}catch(_){}
    lastT=performance.now();raf=requestAnimationFrame(loop);
  }else{
    cancelAnimationFrame(raf);setBuzz(0);sim=null;rt=null;gen=null;progErr='';
    parts.forEach(p=>{p.burnt=false;p._on=null;p._=null;p._cc=false;if(p.type==='cap'||p.type==='ecap')p.vc=0;if(p.type==='ecap')p.burst=false});simTime=0;
    setMsg();draw();
  }
}

/* ---------- drawing ---------- */
function drawPart(c,p,r){
  c.save();c.translate(p.x,p.y);c.rotate(p.rot*Math.PI/2);c.lineCap='round';c.lineJoin='round';
  PD[p.type].draw(c,p,r);c.restore();
}
function wirePath(c,a,b,sag){c.beginPath();c.moveTo(a.x,a.y);c.quadraticCurveTo((a.x+b.x)/2,(a.y+b.y)/2+sag,b.x,b.y)}

      ctx.strokeStyle='#1d8fff';ctx.setLineDash([5,4]);ctx.lineWidth=1.5;rr(ctx,b[0]-3,b[1]-3,b[2]-b[0]+6,b[3]-b[1]+6,6);ctx.stroke();ctx.restore()}

function fitView(){

    [[b[0],b[1]],[b[2],b[1]],[b[0],b[3]],[b[2],b[3]]].forEach(([x,y])=>{const wx=p.x+x*c-y*s,wy=p.y+x*s+y*c;
      x0=Math.min(x0,wx);x1=Math.max(x1,wx);y0=Math.min(y0,wy);y1=Math.max(y1,wy)})}
  const w=cv.clientWidth,h=cv.clientHeight,k=Math.max(0.3,Math.min(1.2,Math.min(w/(x1-x0+80),h/(y1-y0+90))));
  view.k=k;view.ox=(w-(x1-x0)*k)/2-x0*k;view.oy=(h-(y1-y0)*k)/2-y0*k;

/* ---------- hit testing ---------- */
function hitTerm(m){
  const o=ord();
  for(let i=o.length-1;i>=0;i--){
    const p=o[i],pins=PD[p.type].pins,isB=p.type==='breadboard';
    if(isB&&!inBox(p,m,0))continue;
    let best=-1,bd=isB?42:72;
    for(let j=0;j<pins.length;j++){const w=pinW(p,j),d=(w.x-m.x)**2+(w.y-m.y)**2;if(d<bd){bd=d;best=j}}
    if(best>=0)return{p,t:best};

}
function hitPart(m){const o=ord();for(let i=o.length-1;i>=0;i--)if(inBox(o[i],m,3))return o[i];return null}
function hitWire(m){
  for(let i=wires.length-1;i>=0;i--){
    const a=pinW(wires[i].a.p,wires[i].a.t),b=pinW(wires[i].b.p,wires[i].b.t),sag=wSag(a,b);
    for(let s=0;s<=16;s++){const u=s/16,x=(1-u)*(1-u)*a.x+2*u*(1-u)*((a.x+b.x)/2)+u*u*b.x,y=(1-u)*(1-u)*a.y+2*u*(1-u)*((a.y+b.y)/2+sag)+u*u*b.y;
      if(Math.hypot(x-m.x,y-m.y)<6)return wires[i]}
  }
  return null;

/* ---------- interaction ---------- */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-view.ox)/view.k,y:(e.clientY-r.top-view.oy)/view.k}}
function addWire(t){
  if(t.p===wireFrom.p&&t.t===wireFrom.t)return;
  const same=w=>(w.a.p===t.p&&w.a.t===t.t&&w.b.p===wireFrom.p&&w.b.t===wireFrom.t)||(w.b.p===t.p&&w.b.t===t.t&&w.a.p===wireFrom.p&&w.a.t===wireFrom.t);
  if(wires.some(same)){snap();wires=wires.filter(w=>!same(w));sel=null;return}   // connecting the same two pins again removes the wire
  snap();connect(wireFrom.p,wireFrom.t,t.p,t.t);
}
function rotateSel(){if(sel&&sel.kind==='part'){snap();sel.o.rot=(sel.o.rot+1)%4;draw()}}
function deleteSel(){
  if(!sel)return;snap();
  if(sel.kind==='part'){wires=wires.filter(w=>w.a.p!==sel.o&&w.b.p!==sel.o);parts=parts.filter(p=>p!==sel.o)}
  else wires=wires.filter(w=>w!==sel.o);
  sel=null;draw();
}
function dupSel(){
  if(!sel||sel.kind!=='part')return;
  snap();const o={};for(const k in sel.o)if(k[0]!=='_')o[k]=sel.o[k];delete o.id;
  const p=newPart(sel.o.type,sel.o.x+24,sel.o.y+24,JSON.parse(JSON.stringify(o)));p.rot=sel.o.rot;parts.push(p);sel={kind:'part',o:p};draw();
}
function editPart(p){
  if(p.type==='uno'){toggleCode(true);return}
  snap();
  if(p.type==='resistor'){const v=parseVal(prompt('Resistance (e.g. 220, 4.7k, 1M):',fmtSI(p.val,'').replace(' ','')));if(v>0)p.val=v}
  else if(p.type==='pot'){const v=parseVal(prompt('Potentiometer resistance (e.g. 10k):',fmtSI(p.val,'').replace(' ','')));if(v>0)p.val=v}
  else if(p.type==='cap'){const v=parseVal(prompt('Capacitance (e.g. 100n, 10u, 1000u):',fmtSI(p.val,'').replace(' ','')));if(v>0)p.val=v}
  else if(p.type==='led'||p.type==='bar'){const k=Object.keys(LEDC);p.color=k[(k.indexOf(p.color)+1)%k.length]}
  else if(p.type==='rgb'||p.type==='seg7'){p.mode=p.mode==='anode'?'cathode':'anode'}
  else if(p.type==='ecap'){const v=parseVal(prompt('Capacitance (e.g. 100u, 1000u):',fmtSI(p.val,'').replace(' ','')));if(v>0)p.val=v;
    const r=parseFloat(prompt('Voltage rating (V):',p.rating));if(r>0)p.rating=r}
  else if(p.type==='scope'){const t=parseVal(prompt('Time per division (e.g. 1m, 100u, 0.5):',fmtSI(p.tdiv,'').replace(' ','')));if(t>0)p.tdiv=t;
    const v=parseVal(prompt('Volts per division (e.g. 1, 500m, 5):',fmtSI(p.vdiv,'').replace(' ','')));if(v>0)p.vdiv=v}
  else if(p.type==='fgen'){const f=parseVal(prompt('Frequency in Hz (e.g. 50, 1k, 100k):',fmtSI(p.freq,'').replace(' ','')));if(f>=1&&f<=1e6)p.freq=f;
    const a=parseFloat(prompt('Amplitude (peak volts):',p.amp));if(a>=0&&a<=12)p.amp=a;
    const o=parseFloat(prompt('DC offset (volts):',p.off));if(!isNaN(o)&&Math.abs(o)<=10)p.off=o}
  else if(p.type==='psu'){const v=parseFloat(prompt('Output voltage (0-30 V):',p.volt));if(v>=0&&v<=30)p.volt=v;
    const i=parseFloat(prompt('Current limit (0-5 A):',p.ilim));if(i>=0&&i<=5)p.ilim=i}
  else undoStack.pop();
  draw();
}
cv.addEventListener('pointerdown',e=>{
  const m=pos(e);mouse=m;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(e.button===1||e.button===2){pan={sx:e.clientX,sy:e.clientY,ox:view.ox,oy:view.oy};e.preventDefault();return}
  if(wireFrom&&pendingClick){
    const t=hitTerm(m);if(t)addWire(t);
    wireFrom=null;pendingClick=false;draw();return;
  }
  const t=hitTerm(m);
  if(t){wireFrom=t;pendingClick=false;wireFrom.sx=e.clientX;wireFrom.sy=e.clientY;sel=null;draw();return}
  const p=hitPart(m);
  if(p){
    sel={kind:'part',o:p};
    const hh=PD[p.type].hit&&PD[p.type].hit(p,toLocal(p,m));
    if(hh){
      if(hh.click){snap();hh.click(p);draw();return}
      if(hh.knob){drag={ctl:hh.knob,p,y:e.clientY,start:p[hh.knob.key],snapped:false};draw();return}
    }
    const now=performance.now();
    if(lastTap.p===p&&now-lastTap.t<420){lastTap={p:null,t:0};editPart(p);draw();return}
    lastTap={p,t:now};
    if(p.type==='pot'){const l=toLocal(p,m);if(Math.hypot(l.x-12,l.y+30)<26){drag={knob:true,p,y:e.clientY,snapped:false};draw();return}}
    if(p.type==='push')p.pressed=true;
    drag={p,dx:m.x-p.x,dy:m.y-p.y,sx:e.clientX,sy:e.clientY,moved:false};
  }else{
    const w=hitWire(m);
    if(w)sel={kind:'wire',o:w};
    else{sel=null;pan={sx:e.clientX,sy:e.clientY,ox:view.ox,oy:view.oy}}
  }
  draw();
});
window.addEventListener('pointermove',e=>{
  const m=pos(e);mouse=m;
  if(pan){view.ox=pan.ox+e.clientX-pan.sx;view.oy=pan.oy+e.clientY-pan.sy}
  else if(drag&&drag.ctl){
    if(!drag.snapped){snap();drag.snapped=true}
    const k=drag.ctl,f=(drag.y-e.clientY)/160;let v;
    v=k.log?drag.start*Math.pow(k.max/k.min,f):drag.start+f*(k.max-k.min);
    v=Math.max(k.min,Math.min(k.max,v));if(k.step)v=Math.round(v/k.step)*k.step;
    drag.p[k.key]=v;
  }
  else if(drag&&drag.knob){
    if(!drag.snapped){snap();drag.snapped=true}
    drag.p.pos=Math.max(0,Math.min(1,drag.p.pos+(drag.y-e.clientY)/120));drag.y=e.clientY;
  }
  else if(drag){
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true;snap();if(drag.p.type==='push')drag.p.pressed=false}
    if(drag.moved){drag.p.x=Math.round((m.x-drag.dx)/12)*12;drag.p.y=Math.round((m.y-drag.dy)/12)*12}
  }
  draw();
});
window.addEventListener('pointerup',e=>{
  const m=pos(e);
  if(pan)pan=null;
  if(wireFrom&&!pendingClick){
    const t=hitTerm(m);
    if(t&&!(t.p===wireFrom.p&&t.t===wireFrom.t)){addWire(t);wireFrom=null}
    else if(t&&Math.hypot(e.clientX-wireFrom.sx,e.clientY-wireFrom.sy)<5)pendingClick=true;
    else wireFrom=null;
  }
  if(drag){
    if(drag.p&&drag.p.type==='push'&&!drag.moved)drag.p.pressed=false;
    if(!drag.knob&&!drag.ctl&&!drag.moved&&drag.p.type==='slide')drag.p.s=drag.p.s?0:1;
    drag=null;
  }
  draw();
});

function zoomAt(mx,my,factor){
  const k0=view.k,k1=Math.max(0.3,Math.min(3,k0*factor));
  view.ox=mx-(mx-view.ox)*k1/k0;view.oy=my-(my-view.oy)*k1/k0;view.k=k1;draw();
}
function zoomCenter(factor){zoomAt(cv.clientWidth/2,cv.clientHeight/2,factor)}
document.getElementById('zoomin').onclick=()=>zoomCenter(1.2);

  e.preventDefault();

},{passive:false});
// Two-finger pinch zoom for touchscreens (including Android WebView).
let pinchStart=null;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    const a=e.touches[0],b=e.touches[1],r=cv.getBoundingClientRect();
    pinchStart={dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
      k:view.k,mx:(a.clientX+b.clientX)/2-r.left,my:(a.clientY+b.clientY)/2-r.top};
  }
},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinchStart){
    e.preventDefault();
    const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const factor=dist/Math.max(1,pinchStart.dist);
    const k0=view.k,k1=Math.max(0.3,Math.min(3,pinchStart.k*factor));
    view.ox=pinchStart.mx-(pinchStart.mx-view.ox)*k1/k0;
    view.oy=pinchStart.my-(pinchStart.my-view.oy)*k1/k0;
    view.k=k1;draw();
  }
},{passive:false});
cv.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStart=null},{passive:true});
window.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT'))return;

const grid=document.getElementById('grid');
ITEMS.forEach((it,i)=>{
  const d=document.createElement('div');d.className='item';d.draggable=true;d.dataset.name=it.label.toLowerCase();
  const c=document.createElement('canvas');c.width=192;c.height=128;c.style.width='96px';c.style.height='64px';
  const cc=c.getContext('2d'),fake=newPart(it.type,0,0,it.o);
  if(fake.type==='servo'||fake.type==='dc')fake._={ang:60};
  if(fake.type==='bulb'||fake.type==='led'){}
  const b=PD[it.type].bbox,bw=b[2]-b[0],bh=b[3]-b[1],s=Math.min(88/bw,56/bh,1.2);
  cc.scale(2,2);cc.translate(48-(b[0]+bw/2)*s,32-(b[1]+bh/2)*s);cc.scale(s,s);
  cc.lineCap='round';cc.lineJoin='round';
  try{PD[it.type].draw(cc,fake,null)}catch(_){}
  d.appendChild(c);d.appendChild(document.createTextNode(it.label));
  d.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(i)));
  d.addEventListener('click',()=>{
    const cx=(cv.clientWidth/2-view.ox)/view.k,cy=(cv.clientHeight/2-view.oy)/view.k;
    const p=addPart(it.type,0,0,it.o);
    p.x=Math.round((cx-(b[0]+b[2])/2)/12)*12;p.y=Math.round((cy-(b[1]+b[3])/2)/12)*12;draw();
  });
  grid.appendChild(d);
});
document.getElementById('q').oninput=function(){
  const q=this.value.toLowerCase();[...grid.children].forEach(d=>d.style.display=d.dataset.name.includes(q)?'':'none');
};
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{
  e.preventDefault();const it=ITEMS[+e.dataTransfer.getData('text/plain')];if(!it)return;
  const m=pos(e),b=PD[it.type].bbox,p=addPart(it.type,0,0,it.o);
  p.x=Math.round((m.x-(b[0]+b[2])/2)/12)*12;p.y=Math.round((m.y-(b[1]+b[3])/2)/12)*12;draw();
});

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFFCAD - Circuits</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;height:100vh;display:flex;flex-direction:column;background:#eef2f6;color:#1b2b3a;overflow:hidden}
#top{min-height:54px;background:#fff;border-bottom:1px solid #cfd8e0;display:flex;align-items:center;flex-wrap:wrap;padding:6px 12px;gap:6px;flex:none}
button{border:0;border-radius:6px;padding:8px 11px;font-size:13px;cursor:pointer;font-weight:600}
button.sec{background:#e9eef3;color:#1b2b3a}
button.sec:hover{background:#dbe4ec}
button:disabled{opacity:.4;cursor:default}
#codebtn{background:#1d5b8f;color:#fff}
#run{background:#2fb35a;color:#fff;font-size:14px;padding:9px 16px;margin-left:auto}
#run.on{background:#d9453d}
.lbl{font-size:12px;color:#667;margin-left:6px}
#colors{display:flex;gap:5px}
#colors span{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #aab}
#colors span.sel{box-shadow:0 0 0 2px #1d5b8f}
#main{flex:1;display:flex;min-height:0;position:relative}
#wrap{flex:1;position:relative;background:#fff;min-width:0}
canvas#cv{display:block;width:100%;height:100%;touch-action:none}
#side{width:230px;background:#f7f9fb;border-left:1px solid #cfd8e0;display:flex;flex-direction:column;flex:none}
#side .hd{padding:10px 12px 4px;font-weight:700;font-size:14px}
#side .hd small{font-weight:400;color:#889}
#q{margin:6px 12px;padding:7px 9px;border:1px solid #c5d0da;border-radius:6px;font-size:13px}
#grid{flex:1;overflow-y:auto;padding:6px 10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.item{background:#fff;border:1px solid #d6dee6;border-radius:8px;padding:5px 3px 4px;text-align:center;cursor:grab;font-size:11px;line-height:1.2}
.item:hover{border-color:#1d5b8f;background:#eef6fd}
.item canvas{display:block;margin:0 auto 3px}
#code{width:400px;background:#1e2430;color:#e6edf3;border-left:1px solid #0d1117;display:flex;flex-direction:column;flex:none}
#code[hidden]{display:none}
#code .ch{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#161b24;font-size:13px}
#code .ch b{flex:1}
#code select,#code input{background:#2a3242;color:#e6edf3;border:1px solid #3a455a;border-radius:5px;padding:5px;font-size:12px}
#code button{background:#33405a;color:#fff;padding:5px 9px;font-size:12px}
#src{flex:1;min-height:120px;resize:none;border:0;outline:0;background:#1e2430;color:#e6edf3;font:13px/1.45 Consolas,"Courier New",monospace;padding:10px;tab-size:2;white-space:pre}
#cerr{color:#ff7b72;font-size:12px;padding:0 10px 6px;white-space:pre-wrap;min-height:0}
#ser{height:130px;margin:0;overflow:auto;background:#0d1117;color:#7ee787;font:12px Consolas,monospace;padding:8px;white-space:pre-wrap}
#code .sin{display:flex;gap:6px;padding:6px 10px;background:#161b24}
#code .sin input{flex:1}
#status{height:28px;background:#fff;border-top:1px solid #cfd8e0;font-size:12.5px;padding:5px 12px;flex:none;display:flex;gap:16px}
#hint{color:#667;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg{font-weight:600}
#msg.bad{color:#b3261e}
@media (max-width:860px){
  #side{width:150px}
  #code{position:absolute;left:0;right:0;top:0;bottom:0;width:auto;z-index:5}
  #grid{grid-template-columns:1fr}
}
.logo{display:flex;flex-direction:column;line-height:1.05;margin-right:10px}.logo{font-size:19px;font-weight:800;color:#1d5b8f;letter-spacing:.5px}.logo small{display:block;font-size:10px;font-weight:500;color:#5d6f80;letter-spacing:.2px;margin-top:1px}

#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 38%,#236a9f,#0a2540 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"Segoe UI",Arial,sans-serif;transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash .scene{width:64px;height:64px;perspective:420px;margin-bottom:30px}
#splash .cube{width:64px;height:64px;position:relative;transform-style:preserve-3d;animation:ocSpin 2.6s linear infinite}
#splash .cube i{position:absolute;width:64px;height:64px;border:2px solid #8fd8ff;background:rgba(143,216,255,.10);box-shadow:0 0 14px rgba(143,216,255,.35) inset}
#splash .cube i:nth-child(1){transform:translateZ(32px)}#splash .cube i:nth-child(2){transform:rotateY(180deg) translateZ(32px)}
#splash .cube i:nth-child(3){transform:rotateY(90deg) translateZ(32px)}#splash .cube i:nth-child(4){transform:rotateY(-90deg) translateZ(32px)}
#splash .cube i:nth-child(5){transform:rotateX(90deg) translateZ(32px)}#splash .cube i:nth-child(6){transform:rotateX(-90deg) translateZ(32px)}
@keyframes ocSpin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
#splash .name{font-size:52px;font-weight:800;letter-spacing:4px;background:linear-gradient(90deg,#fff 0%,#8fd8ff 40%,#fff 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ocShine 2s linear infinite,ocRise .8s ease-out both}
@keyframes ocShine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes ocRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#splash .bar{width:190px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:20px;overflow:hidden}
#splash .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fd8ff,#fff);border-radius:2px;animation:ocLoad 1.9s ease-in-out forwards}
@keyframes ocLoad{0%{width:0}60%{width:70%}100%{width:100%}}
#splash button{margin-top:22px;min-width:150px;padding:11px 30px;border:2px solid rgba(255,255,255,.55);border-radius:30px;background:rgba(255,255,255,.08);color:#fff;font:700 16px "Segoe UI",Arial,sans-serif;letter-spacing:2px;cursor:default;transition:all .25s}
#splash button.ready{background:#fff;color:#0f3a5e;border-color:#fff;cursor:pointer;animation:ocPulse 1.6s ease-in-out infinite}
#splash button.ready:hover{transform:scale(1.07)}
@keyframes ocPulse{0%,100%{box-shadow:0 0 0 0 rgba(143,216,255,.55)}50%{box-shadow:0 0 0 12px rgba(143,216,255,0)}}
#creator-credit{position:fixed;right:10px;bottom:7px;z-index:9999;font:12px "Segoe UI",Arial,sans-serif;color:#526273;background:rgba(255,255,255,.92);border:1px solid #d5dee7;border-radius:6px;padding:5px 8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#creator-credit a{color:#1d5b8f;font-weight:700;text-decoration:none}
#creator-credit a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="creator-credit">Made by <a href="https://rayzenyt147.itch.io" target="_blank" rel="noopener noreferrer">Rayzen_YT147</a></div>
<div id="splash"><div class="scene"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="name">OFFCAD</div><div class="bar"><b></b></div><button id="startBtn" disabled>Loading&hellip;</button></div>
<script>(function(){var s=document.getElementById('splash'),b=document.getElementById('startBtn'),t0=Date.now(),ready=false,gone=false;
function enable(){if(ready)return;ready=true;b.disabled=false;b.textContent='Start';b.className='ready';try{b.focus()}catch(e){}}
function go(){if(!ready||gone)return;gone=true;s.classList.add('hide');setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},800)}
b.addEventListener('click',go);document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')go()});
window.addEventListener('load',function(){setTimeout(enable,Math.max(200,1900-(Date.now()-t0)))});setTimeout(enable,4500)})();</script>
<div id="top">
  <div class="logo">OFFCAD</div>
  <button class="sec" id="rot" title="Rotate selected part (R)">&#10227; Rotate</button>
  <button class="sec" id="dup" title="Copy (Ctrl+D)">&#10064; Copy</button>
  <button class="sec" id="del" title="Delete selected (Del)">&#128465; Delete</button>
  <button class="sec" id="undo">&#8630; Undo</button>
  <button class="sec" id="save">Save</button>
  <button class="sec" id="open">Open</button>
  <input type="file" id="file" accept=".json" hidden>
  <button class="sec" id="clr">Clear</button>
  <span class="lbl">Wire</span><div id="colors"></div>
  <button id="codebtn">&lt;/&gt; Code</button>
  <button id="run">&#9654; Start Simulation</button>
</div>
<div id="main">
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="code" hidden>
    <div class="ch"><b>Code (Arduino C++)</b>
      <select id="ex"><option value="">Load example&hellip;</option></select>
      <button id="cclose">&#10005;</button></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div id="cerr"></div>
    <div class="ch"><b>Serial Monitor</b><button id="sclr">Clear</button></div>
    <pre id="ser"></pre>
    <div class="sin"><input id="sin" placeholder="Send text to Arduino"><button id="ssend">Send</button></div>
  </div>
  <div id="side">
    <div class="hd">Components <small>Basic</small></div>
    <input id="q" placeholder="Search components">
    <div id="grid"></div>
  </div>
</div>
<div id="status"><span id="hint">Drag parts in &bull; drag from pin to pin to wire (do it again to remove the wire) &bull; double-click a part to edit &bull; Rotate button or R &bull; wheel zoom &bull; drag empty space to pan</span><span id="msg"></span></div>

<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const DPR=window.devicePixelRatio||1;
let parts=[],wires=[],nextId=1,sel=null,running=false,sim=null,raf=0,lastT=0;
let wireFrom=null,pendingClick=false,drag=null,pan=null,mouse={x:0,y:0},wireColor='#2fb34a',lastTap={p:null,t:0};
let view={k:1,ox:20,oy:10},undoStack=[],sketch='',progErr='',rt=null,gen=null;
const COS=[1,0,-1,0],SIN=[0,1,0,-1];
const LEDC={red:{c:'#ff2a2a',vf:1.9},green:{c:'#25d84a',vf:2.1},yellow:{c:'#ffd22a',vf:2.0},blue:{c:'#3a7bff',vf:3.0},white:{c:'#f4f4ff',vf:3.0}};
const BAND=['#000','#7a3b10','#e22','#f80','#fd0','#2a2','#25f','#a3f','#888','#fff'];
const BAT={battery9:{v:9,r:1.5},coin:{v:3,r:10},aa:{v:1.5,r:0.2}};
const WCOLORS=['#2fb34a','#e03a3a','#222','#2f6fe0','#f0c020','#f0801c','#9b4fd0','#888'];

/* ---------- small helpers ---------- */
function line(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2)}
function fmtI(i){const a=Math.abs(i);return a<1e-3?(i*1e6).toFixed(0)+' \u00B5A':a<1?(i*1e3).toFixed(1)+' mA':i.toFixed(2)+' A'}
function fmtSI(v,u){const a=Math.abs(v),t=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'\u00B5'],[1e-9,'n'],[1e-12,'p']];
  for(const[s,p]of t)if(a>=s*0.9999)return +(v/s).toPrecision(3)+' '+p+u;return v+' '+u}
function parseVal(s){
  s=String(s).trim().replace(/[\u03A9\u2126]|ohms?|farads?|f$/gi,'').trim();
  const m=s.match(/^([0-9.]+)\s*([pnu\u00B5mkMG]?)/);if(!m)return NaN;
  const mult={p:1e-12,n:1e-9,u:1e-6,'\u00B5':1e-6,m:1e-3,k:1e3,M:1e6,G:1e9,'':1};
  return parseFloat(m[1])*mult[m[2]];
}
function pinW(p,i){const q=PD[p.type].pins[i],c=COS[p.rot],s=SIN[p.rot];return{x:p.x+q.x*c-q.y*s,y:p.y+q.x*s+q.y*c}}
function toLocal(p,m){const dx=m.x-p.x,dy=m.y-p.y,c=COS[p.rot],s=SIN[p.rot];return{x:dx*c+dy*s,y:-dx*s+dy*c}}
function inBox(p,m,pad){const l=toLocal(p,m),b=PD[p.type].bbox;return l.x>=b[0]-pad&&l.x<=b[2]+pad&&l.y>=b[1]-pad&&l.y<=b[3]+pad}
function ord(){return parts.filter(p=>p.type==='breadboard').concat(parts.filter(p=>p.type!=='breadboard'))}

/* ---------- breadboard pins ---------- */
const bbPins=[],bbGroups={};
function bbIdx(c,r){const k={3:0,4:1,5:2,6:3,7:4,9:5,10:6,11:7,12:8,13:9,0:10,1:11,15:12,16:13}[r];return (c-1)*14+k}
(function(){
  for(let c=1;c<=30;c++){
    const x=(c-15)*12;
    const add=(r,g)=>{bbPins.push({x,y:(r-8)*12,n:'hole'});(bbGroups[g]=bbGroups[g]||[]).push(bbPins.length-1)};
    [3,4,5,6,7].forEach(r=>add(r,'A'+c));
    [9,10,11,12,13].forEach(r=>add(r,'B'+c));
    [0,1,15,16].forEach(r=>add(r,'R'+r));
  }
})();

/* ---------- Arduino Uno pins ---------- */
const UNO=[],UNO_D={},UNO_GND=[];let UNO_5V=0,UNO_33=0;
(function(){
  const add=(x,y,n,d)=>{UNO.push({x,y,n});const i=UNO.length-1;if(d!==undefined)UNO_D[d]=i;return i};
  [['AREF'],['GND'],['13',13],['12',12],['11',11],['10',10],['9',9],['8',8]].forEach((q,k)=>{const i=add(k*12,0,q[0],q[1]);if(q[0]==='GND')UNO_GND.push(i)});
  [7,6,5,4,3,2,1,0].forEach((d,k)=>add(108+k*12,0,String(d),d));
  [['IOREF'],['RESET'],['3.3V'],['5V'],['GND'],['GND'],['VIN']].forEach((q,k)=>{const i=add(24+k*12,216,q[0]);
    if(q[0]==='GND')UNO_GND.push(i);if(q[0]==='5V')UNO_5V=i;if(q[0]==='3.3V')UNO_33=i});
  for(let a=0;a<6;a++)add(120+a*12,216,'A'+a,14+a);
})();

/* ---------- part definitions ---------- */
const PD={};

PD.breadboard={name:'Breadboard Small',pins:bbPins,bbox:[-190,-114,202,114],
 draw(c){
  c.fillStyle='#e9e9e7';rr(c,-190,-114,392,228,8);c.fill();c.strokeStyle='#b9b9b5';c.lineWidth=1.5;c.stroke();
  c.fillStyle='#d6d6d2';c.fillRect(-190,-8,392,16);
  c.fillStyle='#4a90e2';c.fillRect(-172,-105,348,1.6);c.fillRect(-172,74.5,348,1.6);
  c.fillStyle='#e04545';c.fillRect(-172,-75.5,348,1.6);c.fillRect(-172,104.5,348,1.6);
  c.fillStyle='#55585c';c.beginPath();
  for(const q of bbPins)c.rect(q.x-2.2,q.y-2.2,4.4,4.4);
  c.fill();
  c.fillStyle='#808080';c.font='7px Arial';c.textAlign='center';
  for(let n=1;n<=30;n++)if(n===1||n%5===0){const x=(n-15)*12;c.fillText(n,x,-70);c.fillText(n,x,78)}
  'jihgf'.split('').forEach((l,i)=>{c.fillText(l,-182,(3+i-8)*12+2.5);c.fillText(l,194,(3+i-8)*12+2.5)});
  'edcba'.split('').forEach((l,i)=>{c.fillText(l,-182,(9+i-8)*12+2.5);c.fillText(l,194,(9+i-8)*12+2.5)});
  c.font='bold 9px Arial';
  [[0,'\u2212'],[1,'+'],[15,'\u2212'],[16,'+']].forEach(([r,t])=>{c.fillText(t,-182,(r-8)*12+3);c.fillText(t,194,(r-8)*12+3)});
 }};

PD.uno={name:'Arduino Uno R3',pins:UNO,bbox:[-114,-14,226,230],groups:[UNO_GND],dpin:UNO_D,gnd:UNO_GND,v5:UNO_5V,v33:UNO_33,
 label:()=>'Arduino Uno R3',
 draw(c,p,r){
  c.fillStyle='#0a7c8c';rr(c,-104,-12,328,240,10);c.fill();c.strokeStyle='#065a66';c.lineWidth=2;c.stroke();
  c.fillStyle='#c9ccd0';c.fillRect(-114,30,64,66);c.strokeStyle='#8e9196';c.lineWidth=1.5;c.strokeRect(-114,30,64,66);
  c.fillStyle='#1e1e1e';c.fillRect(-114,138,54,54);
  c.fillStyle='#1b1b1b';[[-6,96],[102,96],[18,84],[114,72]].forEach(([x,w,],k)=>{});
  c.fillRect(-6,-8,96,14);c.fillRect(102,-8,96,14);c.fillRect(18,209,84,14);c.fillRect(114,209,72,14);
  c.fillStyle='#b8b8b8';UNO.forEach(q=>c.fillRect(q.x-2.4,q.y-2.4,4.8,4.8));
  c.fillStyle='#ccc';c.font='bold 7.5px Arial';c.textAlign='left';
  UNO.forEach(q=>{c.save();if(q.y<100){c.translate(q.x+3,19);c.rotate(Math.PI/2)}else{c.translate(q.x+3,198);c.rotate(-Math.PI/2)}
    c.fillText(q.n,0,0);c.restore()});
  c.fillStyle='#b92d2d';circ(c,-82,12,7);c.fill();c.strokeStyle='#700';c.lineWidth=1;c.stroke();
  c.fillStyle='#202020';rr(c,40,110,128,36,2);c.fill();
  c.fillStyle='#777';for(let k=0;k<14;k++){c.fillRect(46+k*8.6,106,4,4);c.fillRect(46+k*8.6,146,4,4)}
  c.fillStyle='#e9e9e9';c.font='bold 18px Arial';c.textAlign='center';c.fillText('ARDUINO',104,66);c.font='bold 13px Arial';c.fillText('UNO',104,82);
  c.font='7px Arial';c.fillStyle='#bfe8ee';c.fillText('ATMEGA328P',104,132);
  const on=!!r,l13=r&&r.pv[UNO_D[13]]>2.5;
  c.fillStyle=on?'#4cff6a':'#1d4a24';c.shadowColor=on?'#4cff6a':'transparent';c.shadowBlur=on?8:0;c.fillRect(170,34,8,5);
  c.fillStyle=l13?'#ffb020':'#4a3a14';c.shadowColor=l13?'#ffb020':'transparent';c.shadowBlur=l13?8:0;c.fillRect(150,34,8,5);c.shadowBlur=0;
  c.fillStyle='#ccc';c.font='6px Arial';c.fillText('L',154,48);c.fillText('ON',174,48);
 }};

PD.resistor={name:'Resistor',pins:[{x:-24,y:0,n:'Pin 1'},{x:24,y:0,n:'Pin 2'}],bbox:[-26,-8,26,8],
 label:p=>fmtSI(p.val,'\u03A9'),
 draw(c,p){
  c.strokeStyle='#9a9a9a';c.lineWidth=2.6;line(c,-24,0,-13,0);line(c,13,0,24,0);
  c.fillStyle='#e6cf9a';rr(c,-15,-5.5,30,11,5);c.fill();c.strokeStyle='#b39a62';c.lineWidth=.8;c.stroke();
  let v=Math.max(p.val,.1),e=Math.floor(Math.log10(v))-1,d=Math.round(v/Math.pow(10,e));
  if(d>=100){d=Math.round(d/10);e++}
  const m=Math.max(-1,Math.min(9,e));
  const cols=[BAND[Math.floor(d/10)%10],BAND[d%10],m<0?'#d4af37':BAND[m],'#d4af37'];
  [-9,-4,1,10].forEach((x,i)=>{c.fillStyle=cols[i];c.fillRect(x,-5.5,2.6,11)});
 }};

function domePath(c,x0,w,top){
  const r=w/2;c.beginPath();c.moveTo(x0,-14);c.lineTo(x0,top);c.arc(x0+r,top,r,Math.PI,0);c.lineTo(x0+w,-14);c.closePath();
}
PD.led={name:'LED',pins:[{x:0,y:0,n:'Anode (+)'},{x:12,y:0,n:'Cathode (\u2212)'}],bbox:[-8,-42,20,4],
 label:(p,r)=>p.color+' LED'+(r?'  '+fmtI(r.i):''),
 draw(c,p,r){
  const col=LEDC[p.color].c,lit=r&&r.i>0.0008&&!p.burnt,b=lit?Math.min(1,r.i/0.02):0;
  c.strokeStyle='#aaa';c.lineWidth=2;line(c,0,0,0,-14);line(c,12,0,12,-14);
  c.save();
  if(p.burnt)c.fillStyle='#555';else{c.fillStyle=col;c.globalAlpha=lit?.5+.5*b:.4;if(lit){c.shadowColor=col;c.shadowBlur=12+44*b}}
  domePath(c,-4,20,-27);c.fill();c.restore();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;domePath(c,-4,20,-27);c.stroke();
  c.fillStyle='rgba(0,0,0,.22)';c.fillRect(-6,-16,24,3);
  c.fillStyle='rgba(255,255,255,.55)';circ(c,2,-30,2.6);c.fill();
  if(p.burnt){c.strokeStyle='#f55';c.lineWidth=3;line(c,-1,-32,13,-18);line(c,13,-32,-1,-18)}
 }};

function fmtV(v,u){const a=Math.abs(v);return a<1?(v*1000).toFixed(1)+' m'+u:v.toFixed(2)+' '+u}
function fmtT(t){return t>=1?+t.toPrecision(3)+' s':t>=1e-3?+(t*1e3).toPrecision(3)+' ms':+(t*1e6).toPrecision(3)+' \u00B5s'}

function lexSketch(src){
  const toks=[],macros={};let i=0,line=1;const n=src.length;
  const OPS=['<<=','>>=','++','--','+=','-=','*=','/=','%=','&=','|=','^=','<<','>>','<=','>=','==','!=','&&','||','->','::'];
  while(i<n){
    const ch=src[i];
    if(ch==='\n'){line++;i++;continue}
    if(/\s/.test(ch)){i++;continue}
    if(ch==='/'&&src[i+1]==='/'){while(i<n&&src[i]!=='\n')i++;continue}
    if(ch==='/'&&src[i+1]==='*'){const e=src.indexOf('*/',i+2),seg=src.slice(i,e<0?n:e+2);line+=(seg.match(/\n/g)||[]).length;i=e<0?n:e+2;continue}
    if(ch==='#'){let e=i;while(e<n&&src[e]!=='\n')e++;const dl=src.slice(i,e);i=e;
      const m=dl.match(/^#\s*define\s+(\w+)(\(?)\s*(.*)$/);
      if(m){if(m[2])throw new Error('line '+line+": function-style #define macros are not supported");macros[m[1]]=m[3].trim()}
      continue}
    if(/[A-Za-z_]/.test(ch)){let e=i;while(e<n&&/\w/.test(src[e]))e++;toks.push({k:'id',v:src.slice(i,e),line});i=e;continue}
    if(/[0-9]/.test(ch)||(ch==='.'&&/[0-9]/.test(src[i+1]||''))){
      const m=src.slice(i).match(/^(0[xX][0-9a-fA-F]+|0[bB][01]+|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)([uUlLfF]*)/);
      const txt=m[1],suf=m[2];let val,isF=false;
      if(/^0[xX]/.test(txt))val=parseInt(txt,16);else if(/^0[bB]/.test(txt))val=parseInt(txt.slice(2),2);
      else{val=parseFloat(txt);isF=/[.eE]/.test(txt)||/[fF]/.test(suf)}
      toks.push({k:'num',v:val,f:isF,line});i+=m[0].length;continue}
    if(ch==='"'){let e=i+1,s='';while(e<n&&src[e]!=='"'){if(src[e]==='\\'){const c=src[e+1];s+=c==='n'?'\n':c==='t'?'\t':c==='r'?'\r':c==='0'?'\0':c;e+=2}else s+=src[e++]}
      toks.push({k:'str',v:s,line});i=e+1;continue}
    if(ch==="'"){let e=i+1,v;if(src[e]==='\\'){const c=src[e+1];v=c==='n'?10:c==='t'?9:c==='r'?13:c==='0'?0:c.charCodeAt(0);e+=2}else{v=src.charCodeAt(e);e++}
      toks.push({k:'num',v,f:false,line});i=e+1;continue}
    let op=OPS.find(o=>src.startsWith(o,i));if(!op)op=ch;
    toks.push({k:'op',v:op,line});i+=op.length;
  }
  return{toks,macros};
}

  let T=[];

    if(t.k==='id'&&L.macros[t.v]!==undefined&&depth<4){expand(lexSketch(L.macros[t.v]).toks.map(x=>Object.assign({},x,{line:t.line})),depth+1)}

  let p=0;
  const scopes=[new Map()],funcs=new Map();
  const err=(m,t)=>{const tk=t||T[p]||T[T.length-1]||{};throw new Error('line '+(tk.line||'?')+': '+m)};

  const conv=(r,tt)=>(tt==='i'&&r.t==='f')?'Math.trunc('+r.c+')':r.c;

      case '==':return{c:'(('+l.c+')===('+r.c+')?1:0)',t:'i'};

}

    return v.toFixed(n===undefined?2:n);

name: Build OFFCAD Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'app/src/main/assets/index.html'
      - '.github/workflows/offcad-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare desktop app
        shell: pwsh
        run: Copy-Item app/src/main/assets/index.html desktop/index.html -Force
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer and portable EXE
        working-directory: desktop
        run: npm run dist
      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: OFFCAD-Windows-EXE
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
